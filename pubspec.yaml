name: islamic_kids_learning
description: "طفلي المسلم - تطبيق تعليمي ممتع للأطفال بطابع إسلامي"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  shared_preferences: ^2.2.2
  audioplayers: ^6.1.0
  http: ^1.2.2


dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/children_logo.png
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFF8F5"
  adaptive_icon_foreground: assets/icon/app_icon.png
