name: بناء APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      # الدخول إلى مجلد مشروع Flutter
      - name: Get dependencies
        working-directory: islamic_kids_learning (1)/islamic_kids_learning
        run: flutter pub get

      # بناء APK
      - name: Build APK
        working-directory: islamic_kids_learning (1)/islamic_kids_learning
        run: flutter build apk --release

      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-kids-learning-apk
          path: islamic_kids_learning (1)/islamic_kids_learning/build/app/outputs/flutter-apk/app-release.apk
