name: islamic_kids_learning
description: "تطبيق تعليمي للأطفال - أرقام وحروف عربية وإنجليزية مع شخصيات إسلامية مشجعة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_tts: ^3.8.5        # للنطق الصوتي للحروف والأرقام
  shared_preferences: ^2.2.2 # لحفظ الملف الشخصي والتقدم محلياً
  confetti: ^0.7.0           # تأثير احتفالي عند إكمال النشاط

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
