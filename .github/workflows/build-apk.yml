name: بناء APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: العثور على مشروع Flutter
        id: find_project
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name pubspec.yaml -not -path './.git/*' | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "لم يتم العثور على pubspec.yaml"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "تم العثور على المشروع:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: تحميل الحزم
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter pub get

      - name: بناء APK
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-kids-learning-apk
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          if-no-files-found: error
