name: تثبيت مصدر التطبيق

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/fix_main.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch main.dart
        run: python3 tools/fix_main.py
      - name: Commit fixed source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'إصلاح مصدر التطبيق وإضافة واجهة نور'
          git push
