name: تجميع النسخة المعدلة

on:
  push:
    branches: [ main ]
    paths:
      - '_source_parts/**'
      - '.github/workflows/assemble-modified.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble main.dart
        shell: bash
        run: |
          set -e
          test -f _source_parts/main_01.dart
          test -f _source_parts/main_02b.dart
          test -f _source_parts/main_03.dart
          test -f _source_parts/main_04.dart
          cat _source_parts/main_01.dart _source_parts/main_02b.dart _source_parts/main_03.dart _source_parts/main_04.dart > lib/main.dart
          rm -rf _source_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart _source_parts
          git commit -m 'إدراج النسخة المعدلة الكاملة لتطبيق طفلي المسلم' || exit 0
          git push
